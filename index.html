<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0e3029">
  <meta name="description" content="Пересчёт доз при индукции и поддержании анестезии у взрослых.">
  <title>Калькулятор анестезии</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./calc.js"></script>
  <script defer src="./catalog.js"></script>
  <script defer src="./infusion-catalog.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="shell">
      <div class="app-title">
        <img src="./icon.svg" alt="" width="40" height="40">
        <h1>Калькулятор анестезии</h1>
      </div>
      <nav aria-label="Разделы" id="nav">
        <button data-tab="calc" type="button">Индукция</button>
        <button data-tab="pump" type="button">Инфузии</button>
        <button data-tab="drugs" type="button">Препараты</button>
      </nav>
    </div>
  </header>
  <main class="shell" id="main"></main>
  <dialog id="dialog"></dialog>
  <div id="status" class="toast" role="status" hidden></div>
</body>
</html>
